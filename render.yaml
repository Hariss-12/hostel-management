# Render Blueprint - New > Blueprint > pick this repo.
# Deploys are triggered by .github/workflows/deploy.yml (autoDeploy is off).
databases:
  - name: hms-db
    databaseName: hostel_management
    plan: free

services:
  # ---------- Backend API ----------
  - type: web
    name: hms-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: hms-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      # Set to your frontend URL after it is created, e.g. https://hms-frontend.onrender.com
      - key: CLIENT_URL
        sync: false

  # ---------- Frontend (static site) ----------
  - type: web
    name: hms-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 20
      # Set to your backend URL + /api, e.g. https://hms-backend.onrender.com/api
      - key: VITE_API_URL
        sync: false
    routes:
      # React Router: send every path to index.html
      - type: rewrite
        source: /*
        destination: /index.html
