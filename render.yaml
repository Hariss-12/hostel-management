# Render Blueprint - MongoDB Atlas is configured separately as a private service variable.
# Deploys are triggered by .github/workflows/deploy.yml (autoDeploy is off).

services:
  # ---------- Backend API ----------
  - type: web
    name: hms-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: hostel_management
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      # Allow the local dev server and the GitHub Pages frontend.
      - key: CLIENT_URL
        value: http://localhost:5173,https://hariss-12.github.io

  # ---------- Frontend (static site) ----------
  - type: web
    name: hms-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 20
      # Set to your backend URL + /api, e.g. https://hms-backend.onrender.com/api
      - key: VITE_API_URL
        value: https://hostel-management-qr6f.onrender.com/api
    routes:
      # React Router: send every path to index.html
      - type: rewrite
        source: /*
        destination: /index.html
